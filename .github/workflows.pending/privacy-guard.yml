# Runs the whole-tree private-pattern guard on every push and pull request.
# Limits: this fires after a push has already reached GitHub, so on a public
# repository it detects rather than prevents. The local pre-push hook in
# .githooks/ is the preventive half and is bypassable with --no-verify.
name: privacy-guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan every tracked text file for listed private-content patterns
        run: python scripts/package_source.py --check-only
