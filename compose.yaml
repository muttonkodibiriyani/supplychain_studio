services:
  invoice-review:
    build: .
    ports:
      - "127.0.0.1:${INVOICE_HOST_PORT:-8000}:8000"
    environment:
      INVOICE_DATA_DIR: /app/data
      INVOICE_WORKERS: "${INVOICE_WORKERS:-auto}"
      INVOICE_MAX_FILE_BYTES: "${INVOICE_MAX_FILE_BYTES:-67108864}"
      INVOICE_MAX_UPLOAD_FILES: "1000"
      INVOICE_MAX_PAGES: "50"
      OMP_THREAD_LIMIT: "1"
    volumes:
      - invoice-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  invoice-data:
